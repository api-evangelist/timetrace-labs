aid: timetrace-labs
name: TimeTrace Labs
description: TimeTrace Labs is a London-based mathematics and artificial intelligence
  company building the measurement layer for healthcare, spun out of a decade of research
  at the University of Oxford and backed by Seedcamp and Fly Ventures. Its quantitative
  measurement platform separates signal from noise in multimodal physiological time-series
  (kinematics, EEG, ECG, actigraphy, glucose, voice), powering analytics for drug development,
  clinical trials, and public health that the company delivers to partners through secure
  APIs and a compliant analytics dashboard — though it publishes no public developer
  portal or API documentation yet.
